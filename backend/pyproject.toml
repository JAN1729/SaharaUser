[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sahara-commute"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.136.3", "uvicorn>=0.28,<1", "httpx==0.28.1", "pydantic==2.13.4", "beautifulsoup4>=4.12,<5", "tzdata>=2025.2"]

[project.optional-dependencies]
browser = ["playwright>=1.60,<2"]
# HTTP-only Scrapling: its full fetchers extra pins an older Playwright.
scrapling = ["scrapling==0.4.8", "curl_cffi>=0.15,<0.16", "browserforge>=1.2.4,<2"]
maps = ["osmium==4.3.1"]

[tool.setuptools.packages.find]
include = ["sahara*"]

[tool.setuptools.package-data]
sahara = ["web/*.html"]
