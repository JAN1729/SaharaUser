[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visaguy-mcp"
version = "1.0.0"
description = "Official VisaGuy MCP Server with TypeSafe JEV System-1 Hyperclassification and Multimodal Commute Federation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Sahara & VisaGuy Team"}
]
dependencies = [
    "mcp>=2.3.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
visaguy-mcp = "visaguy_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["visaguy_mcp*"]
